name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Update changelog and major version tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Move the Unreleased changelog entries under this release
        uses: ./
        with:
          release-tag: ${{ github.event.release.tag_name }}

      # Projects pin the major version ( e.g. @v1 ), so point it at this release
      - name: Move the major version tag
        if: ${{ !github.event.release.prerelease }}
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          MAJOR="${TAG%%.*}"
          git fetch --force --tags origin
          git tag --force "$MAJOR" "$TAG"
          git push --force origin "refs/tags/$MAJOR"
